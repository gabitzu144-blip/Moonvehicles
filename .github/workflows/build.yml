name: Build mod
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Unpack project and place the two mod jars
        run: |
          unzip -q mooncity-vehicles-src.zip
          mkdir -p mooncity-vehicles/libs
          cp *ehicle*.jar mooncity-vehicles/libs/vehicle-1.20.1.jar
          cp *ramework*.jar mooncity-vehicles/libs/framework-1.20.1.jar
          ls -la mooncity-vehicles/libs
      - name: Build
        working-directory: mooncity-vehicles
        run:
