
name: Build Moonvehicles Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Unpack project
        run: |
          unzip -q mooncity-vehicles-src.zip
          mkdir -p mooncity-vehicles/libs
          cp *ehicle*.jar mooncity-vehicles/libs/vehicle-1.20.1.jar
          cp *ramework*.jar mooncity-vehicles/libs/framework-1.20.1.jar
          ls -la mooncity-vehicles/libs

      - name: Build mod
        working-directory: mooncity-vehicles
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Moonvehicles-Forge-1.20.1
          path: mooncity-vehicles/build/libs/*.jar
          if-no-files-found: error
